services:
  5gc:
    container_name: open5gs_5gc
    image: jaiglesias/open5gs_5gc:latest
    env_file:
      - ./configs/open5gs.env
    privileged: true
    command: 5gc -c open5gs-5gc.yml
    volumes:
      - ./logs:/realstack/logs
    networks:
      ran:
        ipv4_address: 10.53.1.2

  gnb:
    container_name: ocudu_gnb
    image: aetherproject/srsran-gnb:rel-1.0.0
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/gnb_zmq.yaml:/config/gnb_zmq.yaml:ro
      - ./logs:/realstack/logs
    networks:
      ran:
        ipv4_address: 10.53.1.3
      ric_network:
        ipv4_address: 10.0.2.2
    depends_on:
      - 5gc
    command: gnb -c /config/gnb_zmq.yaml

  srsue:
    container_name: srsue
    image: srsue:local
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: "service:gnb"
    volumes:
      - ./configs/ue_zmq.conf:/config/ue_zmq.conf:ro
      - ./logs:/realstack/logs
    depends_on:
      - gnb
    command: srsue /config/ue_zmq.conf

  dbaas:
    container_name: ric_dbaas
    hostname: dbaas
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-dbaas:0.6.4
    command: redis-server --loadmodule /usr/local/libexec/redismodule/libredismodule.so
    networks:
      ric_network:
        ipv4_address: 10.0.2.12

  rtmgr_sim:
    container_name: ric_rtmgr_sim
    hostname: rtmgr_sim
    image: rtmgr_sim:i-release
    environment:
      - CONTAINER_NAME=ric_rtmgr
      - HOST_NAME=ric_rtmgr_host
      - POD_NAME=rtmgr_pod
      - SERVICE_NAME=ric_rtmgr_service
      - CFGFILE=/cfg/rtmgr-config.yaml
      - RMR_SEED_RT=/opt/config/uta-rtg.rt
      - RMR_SRC_ID=10.0.2.15
    volumes:
      - ./oran-sc-ric/ric/configs/rtmgr.yaml:/opt/rmsimulator/resources/configuration.yaml:ro
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/config/uta-rtg.rt:ro
    networks:
      ric_network:
        ipv4_address: 10.0.2.15

  submgr:
    container_name: ric_submgr
    hostname: submgr
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-submgr:0.10.1
    depends_on:
      - dbaas
    env_file:
      - ./oran-sc-ric/.env
    environment:
      - CONTAINER_NAME=ric_submgr
      - HOST_NAME=ric_submgr_host
      - POD_NAME=submgr_pod
      - SERVICE_NAME=ric_submgr_service
      - CFG_FILE=/opt/config/submgr-config.yaml
      - RMR_SEED_RT=/opt/config/submgr-uta-rtg.rt
      - RMR_SRC_ID=10.0.2.13
    command: ./submgr -f /opt/config/submgr-config.yaml
    volumes:
      - ./oran-sc-ric/ric/configs/submgr.yaml:/opt/config/submgr-config.yaml:ro
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/config/submgr-uta-rtg.rt:ro
    networks:
      ric_network:
        ipv4_address: 10.0.2.13

  e2term:
    container_name: ric_e2term
    hostname: e2term
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-e2:6.0.4
    environment:
      - CONTAINER_NAME=ric_e2term
      - HOST_NAME=ric_e2term_host
      - POD_NAME=e2term_pod
      - SERVICE_NAME=ric_e2term_service
      - print=1
      - RMR_SEED_RT=/opt/e2/dockerRouter.txt
      - RMR_SRC_ID=10.0.2.10
    command: ./e2 -p config -f config.conf
    volumes:
      - ./oran-sc-ric/ric/configs/e2term.conf:/opt/e2/config/config.conf:ro
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/e2/dockerRouter.txt:ro
    networks:
      ric_network:
        ipv4_address: 10.0.2.10

  appmgr:
    container_name: ric_appmgr
    hostname: appmgr
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-appmgr:0.5.7
    env_file:
      - ./oran-sc-ric/.env
    environment:
      - CONTAINER_NAME=ric_appmgr
      - HOST_NAME=ric_appmgr_host
      - POD_NAME=appmgr_pod
      - SERVICE_NAME=ric_appmgr_service
      - RMR_SEED_RT=/opt/ric/config/router.txt
      - RMR_SRC_ID=10.0.2.14
    volumes:
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/ric/config/router.txt:ro
      - ./oran-sc-ric/ric/configs/appmgr.yaml:/opt/ric/config/appmgr.yaml:ro
    networks:
      ric_network:
        ipv4_address: 10.0.2.14

  e2mgr:
    container_name: ric_e2mgr
    hostname: e2mgr
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-e2mgr:6.0.4
    env_file:
      - ./oran-sc-ric/.env
    environment:
      - CONTAINER_NAME=ric_e2mgr
      - HOST_NAME=ric_e2mgr_host
      - POD_NAME=e2mgr_pod
      - SERVICE_NAME=ric_e2mgr_service
      - RMR_SEED_RT=/opt/E2Manager/router.txt
      - RMR_SRC_ID=10.0.2.11
    command: ./main -port=3800 -f /opt/E2Manager/resources/configuration.yaml
    volumes:
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/E2Manager/router.txt:ro
      - ./oran-sc-ric/ric/configs/e2mgr.yaml:/opt/E2Manager/resources/configuration.yaml:ro
    networks:
      ric_network:
        ipv4_address: 10.0.2.11

  python_xapp_runner:
    container_name: python_xapp_runner
    hostname: python_xapp_runner
    image: python_xapp_runner:i-release
    environment:
      - PYTHONUNBUFFERED=0
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - RMR_SEED_RT=/opt/ric/config/uta-rtg.rt
      - RMR_SRC_ID=10.0.2.20
      - RMR_RTG_SVC=
    stdin_open: true
    tty: true
    entrypoint: [/bin/bash]
    volumes:
      - ./oran-sc-ric/ric/configs/routes.rtg:/opt/ric/config/uta-rtg.rt:ro
      - ./oran-sc-ric/xApps/python:/opt/xApps
    networks:
      ric_network:
        ipv4_address: 10.0.2.20

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  ric_network:
    ipam:
      driver: default
      config:
        - subnet: 10.0.2.0/24
